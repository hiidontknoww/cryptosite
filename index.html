<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Elite Crypto — Accès sécurisé</title>

<style>
  :root{
    --bg:#ffffff;
    --ink:#0b0b0b;
    --muted:#8d8d8d;
    --line:rgba(0,0,0,.07);
    --screen:#070708;
    --screen-soft:#101012;
    --danger:#ff7d7d;
    --ease:cubic-bezier(.16,1,.3,1);
  }

  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
  }

  html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#fff;
  }

  body{
    font-family:
      Inter,
      "SF Pro Display",
      "SF Pro Text",
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      Helvetica,
      Arial,
      sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    user-select:none;
  }

  button{
    font:inherit;
    border:0;
    cursor:pointer;
    touch-action:manipulation;
  }

  /* =========================================================
     INTRO NOIRE
  ========================================================= */

  .intro{
    position:fixed;
    inset:0;
    z-index:100;
    background:#000;
    pointer-events:none;
    animation:introOut 1.85s var(--ease) forwards;
  }

  .intro::after{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(circle at 50% 48%,rgba(255,255,255,.045),transparent 28%);
    opacity:0;
    animation:introGlow 1.45s .15s ease forwards;
  }

  @keyframes introOut{
    0%,36%{opacity:1}
    100%{opacity:0;visibility:hidden}
  }

  @keyframes introGlow{
    0%{opacity:0}
    50%{opacity:.65}
    100%{opacity:0}
  }

  /* =========================================================
     PIÈCE BLANCHE
  ========================================================= */

  .room{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:#fff;
    perspective:1200px;
  }

  .back-wall{
    position:absolute;
    inset:0;
    background:
      radial-gradient(circle at 50% 35%,#fff 0 38%,#fdfdfd 68%,#fafafa 100%);
  }

  /* séparation mur / sol */
  .wall-floor-line{
    position:absolute;
    left:0;
    right:0;
    top:68%;
    height:1px;
    background:rgba(0,0,0,.075);
    box-shadow:
      0 1px 0 rgba(255,255,255,.95),
      0 7px 16px rgba(0,0,0,.025);
    z-index:2;
  }

  .floor{
    position:absolute;
    left:-8%;
    right:-8%;
    top:68%;
    bottom:-16%;
    transform-origin:50% 0;
    transform:perspective(1200px) rotateX(68deg);
    background:
      linear-gradient(
        180deg,
        #f9f9f9 0%,
        #ffffff 42%,
        #fbfbfb 100%
      );
    box-shadow:
      inset 0 28px 45px rgba(255,255,255,.98),
      inset 0 -35px 85px rgba(0,0,0,.012);
  }

  .floor-reflection{
    position:absolute;
    left:50%;
    top:69%;
    width:min(520px,58vw);
    height:20vh;
    transform:translateX(-50%);
    background:
      radial-gradient(
        ellipse at 50% 0%,
        rgba(0,0,0,.075),
        rgba(0,0,0,.025) 26%,
        transparent 68%
      );
    filter:blur(18px);
    opacity:.34;
    pointer-events:none;
  }

  .ambient-light{
    position:absolute;
    left:50%;
    top:16%;
    width:min(760px,72vw);
    height:42vh;
    transform:translateX(-50%);
    background:radial-gradient(ellipse at center,rgba(255,255,255,.95),transparent 72%);
    filter:blur(28px);
    pointer-events:none;
  }

  /* =========================================================
     POTEAU / SUPPORT VERTICAL
  ========================================================= */

  .pedestal{
    position:absolute;
    left:50%;
    bottom:-2.5%;
    width:126px;
    height:64%;
    transform:translateX(-50%);
    z-index:3;
  }

  .pedestal-body{
    position:absolute;
    inset:0 0 18px;
    border-radius:8px 8px 5px 5px;
    background:
      linear-gradient(
        90deg,
        #e7e7e7 0%,
        #f8f8f8 13%,
        #ffffff 36%,
        #f6f6f6 66%,
        #dedede 100%
      );
    border:1px solid rgba(0,0,0,.055);
    box-shadow:
      14px 22px 34px rgba(0,0,0,.075),
      inset 1px 0 0 rgba(255,255,255,.95),
      inset -1px 0 0 rgba(0,0,0,.035);
  }

  /* lignes techniques discrètes qui donnent du volume */
  .pedestal-body::before{
    content:"";
    position:absolute;
    left:14px;
    right:14px;
    top:22px;
    bottom:24px;
    border-left:1px solid rgba(0,0,0,.055);
    border-right:1px solid rgba(0,0,0,.035);
    box-shadow:
      inset 10px 0 18px rgba(255,255,255,.75),
      inset -8px 0 16px rgba(0,0,0,.015);
    pointer-events:none;
  }

  .pedestal-body::after{
    content:"";
    position:absolute;
    left:11px;
    right:11px;
    top:46%;
    height:1px;
    background:rgba(0,0,0,.065);
    box-shadow:
      0 1px 0 rgba(255,255,255,.9),
      0 112px 0 rgba(0,0,0,.045),
      0 113px 0 rgba(255,255,255,.8);
  }

  .pedestal-neck{
    position:absolute;
    left:50%;
    top:-26px;
    width:92px;
    height:52px;
    transform:translateX(-50%);
    border-radius:10px 10px 4px 4px;
    background:
      linear-gradient(
        90deg,
        #dcdcdc 0%,
        #fafafa 17%,
        #ffffff 50%,
        #eeeeee 82%,
        #d7d7d7 100%
      );
    border:1px solid rgba(0,0,0,.06);
    box-shadow:
      0 10px 18px rgba(0,0,0,.065),
      inset 0 1px rgba(255,255,255,.98);
  }

  .pedestal-neck::before{
    content:"";
    position:absolute;
    left:8px;
    right:8px;
    top:11px;
    height:1px;
    background:rgba(0,0,0,.055);
    box-shadow:0 1px 0 rgba(255,255,255,.9);
  }

  .pedestal-neck::after{
    content:"";
    position:absolute;
    left:50%;
    bottom:9px;
    width:54px;
    height:4px;
    transform:translateX(-50%);
    border-radius:8px;
    background:#e8e8e8;
    box-shadow:
      inset 0 1px rgba(255,255,255,.95),
      0 1px 2px rgba(0,0,0,.04);
  }

  .pedestal-base{
    position:absolute;
    left:50%;
    bottom:0;
    width:176px;
    height:24px;
    transform:translateX(-50%);
    border-radius:10px 10px 7px 7px;
    background:
      linear-gradient(180deg,#f8f8f8,#e7e7e7);
    border:1px solid rgba(0,0,0,.055);
    box-shadow:
      0 13px 22px rgba(0,0,0,.075),
      inset 0 1px rgba(255,255,255,.98);
  }

  .pedestal-base::after{
    content:"";
    position:absolute;
    left:50%;
    bottom:-11px;
    width:82%;
    height:16px;
    transform:translateX(-50%);
    border-radius:50%;
    background:rgba(0,0,0,.055);
    filter:blur(9px);
  }

  /* plaque de fixation entre poteau et tablette */
  .tablet-mount{
    position:absolute;
    left:50%;
    top:20.5%;
    width:112px;
    height:72px;
    transform:translateX(-50%);
    z-index:5;
    border-radius:9px;
    background:
      linear-gradient(145deg,#f5f5f5,#dddddd);
    border:1px solid rgba(0,0,0,.06);
    box-shadow:
      0 10px 18px rgba(0,0,0,.075),
      inset 0 1px rgba(255,255,255,.95);
  }

  .tablet-mount::before,
  .tablet-mount::after{
    content:"";
    position:absolute;
    top:50%;
    width:7px;
    height:7px;
    margin-top:-3.5px;
    border-radius:50%;
    background:#d0d0d0;
    box-shadow:
      inset 0 1px rgba(255,255,255,.9),
      0 1px 2px rgba(0,0,0,.06);
  }

  .tablet-mount::before{left:14px}
  .tablet-mount::after{right:14px}

  /* =========================================================
     TABLETTE
  ========================================================= */

  .tablet-stage{
    position:absolute;
    left:50%;
    top:51%;
    width:min(380px,92vw);
    height:min(690px,90vh);
    transform:translate(-50%,-50%);
    display:flex;
    align-items:flex-start;
    justify-content:center;
    z-index:10;
  }

  .tablet-shadow{
    position:absolute;
    left:50%;
    bottom:2.2%;
    width:42%;
    height:4.5%;
    transform:translateX(-50%);
    border-radius:50%;
    background:rgba(0,0,0,.08);
    filter:blur(13px);
    opacity:.42;
  }

  .tablet{
    position:relative;
    z-index:6;
    width:min(350px,100%);
    aspect-ratio:.78;
    padding:8px;
    border-radius:28px;
    background:
      linear-gradient(145deg,#2c2c2e 0%,#111113 27%,#050506 62%,#252527 100%);
    box-shadow:
      0 24px 52px rgba(0,0,0,.18),
      0 10px 20px rgba(0,0,0,.09),
      inset 0 1px rgba(255,255,255,.16),
      inset 0 -1px rgba(0,0,0,.9),
      0 0 0 1px rgba(0,0,0,.82);
    transform:none;
    transform-origin:50% 50%;
  }

  .tablet::before{
    content:"";
    position:absolute;
    top:11px;
    left:50%;
    width:6px;
    height:6px;
    transform:translateX(-50%);
    border-radius:50%;
    background:#020202;
    box-shadow:0 0 0 1px rgba(255,255,255,.04);
    z-index:3;
  }

  .tablet-screen{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
    border-radius:21px;
    background:
      radial-gradient(circle at 50% -5%,rgba(255,255,255,.055),transparent 24%),
      linear-gradient(180deg,#0d0d0f 0%,#070708 55%,#0a0a0c 100%);
    border:1px solid rgba(255,255,255,.07);
    box-shadow:
      inset 0 0 55px rgba(0,0,0,.36),
      inset 0 1px rgba(255,255,255,.025);
    color:#f5f5f5;
  }

  .tablet-screen::before{
    content:"";
    position:absolute;
    inset:0;
    opacity:.11;
    pointer-events:none;
    background:
      repeating-linear-gradient(
        180deg,
        transparent 0 3px,
        rgba(255,255,255,.018) 4px
      );
  }

  .screen-glare{
    position:absolute;
    left:-22%;
    top:-24%;
    width:68%;
    height:65%;
    transform:rotate(24deg);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.04),transparent);
    filter:blur(5px);
    pointer-events:none;
  }

  .ui{
    position:relative;
    z-index:2;
    height:100%;
    display:flex;
    flex-direction:column;
    padding:26px 22px 20px;
  }

  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    min-height:16px;
  }

  .brand{
    text-transform:uppercase;
    font-size:8px;
    font-weight:760;
    letter-spacing:2.2px;
    color:#ececee;
  }

  #clock{
    font-family:"SFMono-Regular",Consolas,monospace;
    color:#69696d;
    font-size:8px;
    letter-spacing:.5px;
  }

  .divider{
    height:1px;
    margin:13px 0 17px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent);
  }

  h1{
    font-size:23px;
    line-height:1.04;
    font-weight:380;
    letter-spacing:-.55px;
  }

  .subtitle{
    margin-top:7px;
    color:#7b7b80;
    text-transform:uppercase;
    font-size:7.5px;
    font-weight:670;
    letter-spacing:1.65px;
  }

  .code-display{
    height:58px;
    margin-top:17px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 12px;
    border:1px solid rgba(255,255,255,.10);
    border-radius:13px;
    background:rgba(255,255,255,.025);
    box-shadow:inset 0 0 22px rgba(0,0,0,.22);
    overflow:hidden;
  }

  #code-mask{
    width:100%;
    min-height:24px;
    text-align:center;
    font-family:"SFMono-Regular",Consolas,monospace;
    font-size:19px;
    font-weight:500;
    letter-spacing:7px;
    padding-left:7px;
    color:#ececee;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:clip;
  }

  .keypad{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:13px;
  }

  .key{
    height:48px;
    min-height:48px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.085);
    background:
      linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.016));
    color:#ececee;
    font-family:"SFMono-Regular",Consolas,monospace;
    font-size:13px;
    box-shadow:
      inset 0 1px rgba(255,255,255,.035),
      0 5px 11px rgba(0,0,0,.15);
    transition:
      transform .1s ease,
      background .14s ease,
      border-color .14s ease;
  }

  .key:hover{
    background:rgba(255,255,255,.075);
    border-color:rgba(255,255,255,.16);
  }

  .key:active{
    transform:scale(.94);
    background:rgba(255,255,255,.10);
  }

  .key.secondary{
    color:#77777c;
    font-size:7.5px;
    font-weight:760;
    letter-spacing:.9px;
  }

  .footer{
    margin-top:auto;
    padding-top:12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    min-height:30px;
  }

  #state{
    display:flex;
    align-items:flex-start;
    gap:8px;
    max-width:220px;
    color:#77777c;
    text-transform:uppercase;
    font-size:7px;
    line-height:1.45;
    font-weight:720;
    letter-spacing:1.15px;
  }

  #state::before{
    content:"";
    width:5px;
    height:5px;
    flex:0 0 5px;
    margin-top:2px;
    border-radius:50%;
    background:#707075;
  }

  #state.error{
    color:var(--danger);
  }

  #state.error::before{
    background:var(--danger);
    box-shadow:0 0 10px rgba(255,90,90,.4);
  }

  .signal{
    display:flex;
    gap:3px;
    align-items:flex-end;
    height:11px;
    margin-left:10px;
  }

  .signal i{
    display:block;
    width:2px;
    border-radius:2px;
    background:#67676c;
  }

  .signal i:nth-child(1){height:4px}
  .signal i:nth-child(2){height:7px}
  .signal i:nth-child(3){height:10px}
  .signal i:nth-child(4){height:11px;opacity:.28}

  .tablet.error{
    animation:tabletError .42s cubic-bezier(.36,.07,.19,.97);
  }

  @keyframes tabletError{
    10%,90%{transform:translateX(-2px)}
    20%,80%{transform:translateX(4px)}
    30%,50%,70%{transform:translateX(-6px)}
    40%,60%{transform:translateX(6px)}
  }

  /* =========================================================
     MOBILE
  ========================================================= */

  @media (max-width:680px){
    .wall-floor-line{
      top:72%;
    }

    .floor{
      top:72%;
    }

    .floor-reflection{
      top:73%;
      width:72vw;
      height:18vh;
      opacity:.25;
    }

    .tablet-stage{
      top:53%;
      width:min(94vw,360px);
      height:min(90vh,680px);
    }

    .tablet{
      width:min(92vw,345px);
      border-radius:25px;
      transform:none;
    }

    .tablet.error{
      animation:tabletErrorMobile .42s cubic-bezier(.36,.07,.19,.97);
    }

    @keyframes tabletErrorMobile{
      10%,90%{transform:translateX(-2px)}
      20%,80%{transform:translateX(4px)}
      30%,50%,70%{transform:translateX(-6px)}
      40%,60%{transform:translateX(6px)}
    }

    .ui{
      padding:22px 18px 16px;
    }

    h1{
      font-size:20px;
    }

    .subtitle{
      margin-top:6px;
      font-size:7px;
      letter-spacing:1.45px;
    }

    .divider{
      margin:10px 0 14px;
    }

    .code-display{
      height:52px;
      margin-top:12px;
    }

    .keypad{
      gap:8px;
      margin-top:10px;
    }

    .key{
      height:50px;
      min-height:50px;
      font-size:14px;
    }

    .key.secondary{
      font-size:8px;
    }

    .footer{
      padding-top:10px;
    }
  }

  @media (max-width:420px){
    .tablet-stage{
      top:52.5%;
      width:95vw;
      height:92vh;
    }

    .tablet{
      width:min(94vw,335px);
      aspect-ratio:.79;
      border-radius:23px;
    }

    .ui{
      padding:20px 16px 15px;
    }

    h1{
      font-size:19px;
    }

    .code-display{
      height:50px;
    }

    .key{
      height:52px;
      min-height:52px;
      font-size:15px;
    }

    #state{
      max-width:205px;
      font-size:6.7px;
    }
  }

  @media (max-width:360px){
    .tablet{
      width:96vw;
      aspect-ratio:.80;
    }

    .ui{
      padding:17px 14px 13px;
    }

    .divider{
      margin:8px 0 11px;
    }

    h1{
      font-size:17px;
    }

    .subtitle{
      font-size:6.5px;
    }

    .code-display{
      height:46px;
      margin-top:9px;
    }

    .keypad{
      gap:6px;
      margin-top:7px;
    }

    .key{
      height:46px;
      min-height:46px;
      font-size:13px;
    }

    .footer{
      padding-top:7px;
    }
  }

  @media (max-height:700px) and (max-width:680px){
    .tablet-stage{
      top:51%;
      height:95vh;
    }

    .tablet{
      width:min(88vw,320px);
      aspect-ratio:.82;
    }

    .ui{
      padding:16px 14px 12px;
    }

    .topbar{
      min-height:12px;
    }

    .brand,
    #clock{
      font-size:7px;
    }

    .divider{
      margin:7px 0 9px;
    }

    h1{
      font-size:17px;
    }

    .subtitle{
      margin-top:3px;
      font-size:6.5px;
    }

    .code-display{
      height:43px;
      margin-top:7px;
    }

    .keypad{
      gap:6px;
      margin-top:6px;
    }

    .key{
      height:40px;
      min-height:40px;
      font-size:12px;
    }

    .footer{
      padding-top:6px;
      min-height:24px;
    }

    #state{
      font-size:6.2px;
      max-width:190px;
    }
  }

  @media (prefers-reduced-motion:reduce){
    *,
    *::before,
    *::after{
      animation-duration:.001ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.001ms !important;
    }
  }

  .tablet-stage > .tablet{
    margin-top:64px;
  }

  /* ombre de contact entre tablette et support */
  .tablet-stage > .tablet::after{
    content:"";
    position:absolute;
    left:50%;
    bottom:-11px;
    width:30%;
    height:10px;
    transform:translateX(-50%);
    border-radius:50%;
    background:rgba(0,0,0,.07);
    filter:blur(7px);
    pointer-events:none;
  }


  @media (max-width:680px){
    .tablet-stage{
      top:51%;
      width:min(94vw,360px);
      height:min(92vh,700px);
      align-items:flex-start;
    }

    .tablet-stage > .tablet{
      margin-top:54px;
    }

    .pedestal{
      width:110px;
      height:58%;
      bottom:-2%;
    }

    .pedestal-neck{
      width:82px;
      height:46px;
      top:-22px;
    }

    .pedestal-base{
      width:154px;
      height:21px;
    }

    .tablet-mount{
      top:17.5%;
      width:98px;
      height:62px;
    }
  }

  @media (max-width:420px){
    .tablet-stage{
      width:95vw;
      height:94vh;
    }

    .tablet-stage > .tablet{
      margin-top:50px;
    }

    .pedestal{
      width:104px;
      height:56%;
    }

    .pedestal-body::after{
      box-shadow:
        0 1px 0 rgba(255,255,255,.9),
        0 96px 0 rgba(0,0,0,.045),
        0 97px 0 rgba(255,255,255,.8);
    }
  }

  @media (max-height:700px) and (max-width:680px){
    .tablet-stage{
      top:50.5%;
      height:96vh;
    }

    .tablet-stage > .tablet{
      margin-top:34px;
    }

    .pedestal{
      height:51%;
      bottom:-2%;
    }

    .tablet-mount{
      top:13.5%;
    }
  }

</style>
</head>

<body>

<div class="intro" aria-hidden="true"></div>

<main class="room">
  <div class="back-wall"></div>
  <div class="ambient-light"></div>
  <div class="wall-floor-line"></div>
  <div class="floor"></div>
  <div class="floor-reflection"></div>

  <section class="tablet-stage" aria-label="Terminal d'accès Elite Crypto">
    <div class="tablet-shadow"></div>

    <div class="pedestal" aria-hidden="true">
      <div class="pedestal-body"></div>
      <div class="pedestal-neck"></div>
      <div class="pedestal-base"></div>
    </div>

    <div class="tablet-mount" aria-hidden="true"></div>

    <div id="tablet" class="tablet">
      <div class="tablet-screen">
        <div class="screen-glare"></div>

        <div class="ui">
          <div class="topbar">
            <span class="brand">Elite Crypto</span>
            <span id="clock">--:--:--</span>
          </div>

          <div class="divider"></div>

          <h1>Accès sécurisé</h1>
          <p class="subtitle">Saisissez votre clé d’accès</p>

          <div class="code-display" aria-live="polite">
            <span id="code-mask"></span>
          </div>

          <div class="keypad" aria-label="Clavier numérique">
            <button class="key" data-key="1">1</button>
            <button class="key" data-key="2">2</button>
            <button class="key" data-key="3">3</button>

            <button class="key" data-key="4">4</button>
            <button class="key" data-key="5">5</button>
            <button class="key" data-key="6">6</button>

            <button class="key" data-key="7">7</button>
            <button class="key" data-key="8">8</button>
            <button class="key" data-key="9">9</button>

            <button class="key secondary" data-action="clear">EFFACER</button>
            <button class="key" data-key="0">0</button>
            <button class="key secondary" data-action="enter">VALIDER</button>
          </div>

          <div class="footer">
            <div id="state">En attente de votre clé</div>

            <div class="signal" aria-hidden="true">
              <i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<script>
(() => {
  "use strict";

  const tablet = document.getElementById("tablet");
  const codeMask = document.getElementById("code-mask");
  const state = document.getElementById("state");
  const clock = document.getElementById("clock");

  let code = "";
  let errorTimer = null;
  let audioCtx = null;

  function updateClock(){
    const now = new Date();
    clock.textContent = now.toLocaleTimeString("fr-FR", {
      hour:"2-digit",
      minute:"2-digit"
    });
  }

  updateClock();
  setInterval(updateClock, 1000);

  function ensureAudio(){
    if (!audioCtx){
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) audioCtx = new Ctx();
    }

    if (audioCtx && audioCtx.state === "suspended"){
      audioCtx.resume().catch(() => {});
    }
  }

  function tone(freq=440,duration=.04,gain=.012,type="sine",delay=0){
    ensureAudio();
    if (!audioCtx) return;

    const oscillator = audioCtx.createOscillator();
    const volume = audioCtx.createGain();

    oscillator.type = type;
    oscillator.frequency.value = freq;

    volume.gain.setValueAtTime(.0001,audioCtx.currentTime + delay);
    volume.gain.exponentialRampToValueAtTime(
      Math.max(gain,.0002),
      audioCtx.currentTime + delay + .005
    );
    volume.gain.exponentialRampToValueAtTime(
      .0001,
      audioCtx.currentTime + delay + duration
    );

    oscillator.connect(volume);
    volume.connect(audioCtx.destination);

    oscillator.start(audioCtx.currentTime + delay);
    oscillator.stop(audioCtx.currentTime + delay + duration + .02);
  }

  function keySound(){
    tone(720,.032,.009,"sine");
    tone(1040,.022,.004,"sine",.01);
  }

  function errorSound(){
    tone(150,.10,.014,"triangle");
    tone(110,.14,.010,"sine",.06);
  }

  function renderCode(){
    codeMask.textContent = code.length
      ? "•".repeat(Math.min(code.length, 14))
      : "";

    if (!state.classList.contains("error")){
      state.textContent = code.length
        ? "Clé en cours de saisie"
        : "En attente de votre clé";
    }
  }

  function appendDigit(digit){
    if (code.length >= 18) return;

    code += digit;
    keySound();

    if (navigator.vibrate){
      navigator.vibrate(7);
    }

    renderCode();
  }

  function clearCode(){
    code = "";
    tone(280,.03,.007,"triangle");
    renderCode();
  }

  function reject(){
    errorSound();

    if (navigator.vibrate){
      navigator.vibrate([20,30,20]);
    }

    tablet.classList.remove("error");
    void tablet.offsetWidth;
    tablet.classList.add("error");

    codeMask.textContent = "ACCÈS REFUSÉ";
    state.className = "error";
    state.textContent = "Clé invalide — accès à Elite Crypto refusé";

    clearTimeout(errorTimer);

    errorTimer = setTimeout(() => {
      code = "";
      tablet.classList.remove("error");
      state.className = "";
      state.textContent = "En attente de votre clé";
      renderCode();
    }, 1700);
  }

  document.querySelectorAll(".key").forEach(button => {
    button.addEventListener("click", () => {
      if (button.dataset.key !== undefined){
        appendDigit(button.dataset.key);
        return;
      }

      if (button.dataset.action === "clear"){
        clearCode();
        return;
      }

      if (button.dataset.action === "enter"){
        reject();
      }
    });
  });

  window.addEventListener("keydown", event => {
    if (/^[0-9]$/.test(event.key)){
      appendDigit(event.key);
      return;
    }

    if (event.key === "Backspace"){
      code = code.slice(0,-1);
      renderCode();
      event.preventDefault();
      return;
    }

    if (event.key === "Escape"){
      clearCode();
      return;
    }

    if (event.key === "Enter"){
      reject();
      event.preventDefault();
    }
  });

  document.addEventListener("pointerdown", ensureAudio, {once:true});

  renderCode();
})();
</script>

</body>
</html>
