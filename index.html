<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Elite — Защищённый доступ</title>

<style>
  :root{
    --bg:#ffffff;
    --fg:#090909;
    --muted:#747474;
    --soft:#efefef;
    --line:rgba(0,0,0,.10);
    --ease:cubic-bezier(.22,.78,.20,1);
    --ease-out:cubic-bezier(.16,1,.30,1);
  }

  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
  }

  html,
  body{
    width:100%;
    height:100%;
    min-height:100%;
    background:var(--bg);
    color:var(--fg);
    overflow:hidden;
  }

  body{
    font-family:
      Inter,
      "SF Pro Display",
      "SF Pro Text",
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      Helvetica,
      Arial,
      sans-serif;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    text-rendering:optimizeLegibility;
    font-synthesis:none;
  }

  button,
  input{
    font:inherit;
  }

  button{
    -webkit-appearance:none;
    appearance:none;
  }

  ::selection{
    background:#000;
    color:#fff;
  }

  /* ---------- AMBIANCE ---------- */

  body::before{
    content:"";
    position:fixed;
    inset:-30%;
    z-index:0;
    pointer-events:none;
    opacity:.34;
    background:
      radial-gradient(circle at 50% 42%, rgba(0,0,0,.045), transparent 27%),
      radial-gradient(circle at 22% 76%, rgba(0,0,0,.026), transparent 20%),
      radial-gradient(circle at 80% 20%, rgba(0,0,0,.022), transparent 18%);
    animation:ambientFloat 18s ease-in-out infinite alternate;
  }

  body::after{
    content:"";
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    opacity:.16;
    background-image:
      linear-gradient(rgba(0,0,0,.018) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,0,0,.014) 1px, transparent 1px);
    background-size:64px 64px;
    mask-image:linear-gradient(to bottom, transparent, #000 20%, #000 80%, transparent);
  }

  @keyframes ambientFloat{
    0%{transform:translate3d(-1.5%, -1%, 0) scale(1)}
    100%{transform:translate3d(1.5%, 1%, 0) scale(1.045)}
  }

  /* ---------- ЭКРАНЫ ---------- */

  .screen{
    position:fixed;
    inset:0;
    z-index:10;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:
      max(24px, env(safe-area-inset-top))
      max(20px, env(safe-area-inset-right))
      max(24px, env(safe-area-inset-bottom))
      max(20px, env(safe-area-inset-left));
    isolation:isolate;
    will-change:transform, opacity, filter;
  }

  #enter-screen{
    z-index:30;
    background:#fff;
    overflow:hidden;
    transition:
      opacity .5s ease,
      visibility 0s linear .55s;
  }

  #enter-screen::before{
    content:"";
    position:absolute;
    left:50%;
    top:50%;
    width:10px;
    height:10px;
    border:1px solid rgba(0,0,0,.2);
    border-radius:50%;
    opacity:0;
    transform:translate(-50%,-50%) scale(.6);
    pointer-events:none;
  }

  #enter-screen.leaving{
    pointer-events:none;
  }

  #enter-screen.leaving #enter-btn{
    color:transparent;
    text-shadow:none;
    letter-spacing:-2px;
    min-width:190px;
    width:190px;
    height:2px;
    padding:0;
    border-width:0;
    border-radius:999px;
    background:#000;
    box-shadow:none;
    transform:scaleX(.78);
    opacity:1;
    transition:
      color .12s ease,
      letter-spacing .24s var(--ease-out),
      min-width .46s .08s var(--ease-out),
      width .46s .08s var(--ease-out),
      height .46s .08s var(--ease-out),
      padding .46s .08s var(--ease-out),
      border-width .25s ease,
      border-radius .35s ease,
      transform .52s .08s var(--ease-out),
      box-shadow .2s ease,
      opacity .28s .62s ease;
  }

  #enter-screen.leaving #enter-btn::before{
    opacity:0;
    transition:opacity .08s linear;
  }

  #enter-screen.leaving::before{
    animation:entryRipple .82s .18s var(--ease-out) both;
  }

  #enter-screen.collapse-line #enter-btn{
    transform:scaleX(.04);
    opacity:0;
  }

  #enter-screen.fade-away{
    opacity:0;
    visibility:hidden;
  }

  @keyframes entryRipple{
    0%{
      opacity:0;
      transform:translate(-50%,-50%) scale(.5);
    }
    25%{
      opacity:.28;
    }
    100%{
      opacity:0;
      transform:translate(-50%,-50%) scale(28);
    }
  }

  #pass-screen{
    z-index:20;
    background:#fff;
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transform:translate3d(0,24px,0) scale(.985);
    filter:blur(8px);
    transition:
      opacity .85s ease,
      transform 1.05s var(--ease-out),
      filter .85s ease,
      visibility 0s linear .9s;
  }

  #pass-screen.show{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
    transform:translate3d(0,0,0) scale(1);
    filter:blur(0);
    transition-delay:0s;
  }

  #pass-screen.leaving{
    opacity:0;
    transform:translate3d(0,-18px,0) scale(.985);
    filter:blur(7px);
    pointer-events:none;
  }

  #member-screen{
    z-index:15;
    background:#fff;
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transform:scale(1.018);
    filter:blur(10px);
    transition:
      opacity 1s ease,
      transform 1.15s var(--ease-out),
      filter 1s ease,
      visibility 0s linear 1.05s;
  }

  #member-screen.show{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
    transform:scale(1);
    filter:blur(0);
    transition-delay:0s;
  }

  /* ---------- ЭНТРЕ / КНОПКА ---------- */

  #enter-btn{
    position:relative;
    z-index:2;
    min-width:min(330px, 82vw);
    padding:22px 38px 22px 50px;
    border:1px solid #000;
    border-radius:999px;
    background:#000;
    color:#fff;
    cursor:pointer;
    overflow:hidden;
    text-transform:uppercase;
    font-size:clamp(13px, 3vw, 16px);
    font-weight:450;
    letter-spacing:clamp(7px, 2.4vw, 12px);
    line-height:1;
    box-shadow:
      0 1px 0 rgba(255,255,255,.15) inset,
      0 18px 50px rgba(0,0,0,.12);
    transition:
      color .15s ease,
      transform .55s var(--ease-out),
      letter-spacing .65s var(--ease-out),
      min-width .45s var(--ease-out),
      width .45s var(--ease-out),
      height .45s var(--ease-out),
      padding .45s var(--ease-out),
      border-radius .45s var(--ease-out),
      box-shadow .55s ease,
      background .45s ease;
    animation:entranceButton 1s .15s both var(--ease-out);
  }

  #enter-btn::before{
    content:"";
    position:absolute;
    top:-50%;
    left:-35%;
    width:28%;
    height:200%;
    opacity:.7;
    transform:rotate(18deg);
    background:linear-gradient(
      to right,
      transparent,
      rgba(255,255,255,.24),
      transparent
    );
    transition:left .8s var(--ease-out);
  }

  #enter-btn:hover{
    transform:translateY(-2px) scale(1.025);
    letter-spacing:clamp(9px, 3vw, 15px);
    background:#080808;
    box-shadow:
      0 1px 0 rgba(255,255,255,.17) inset,
      0 22px 60px rgba(0,0,0,.17);
  }

  #enter-btn:hover::before{
    left:110%;
  }

  #enter-btn:active{
    transform:translateY(0) scale(.985);
    transition-duration:.12s;
  }

  #enter-btn:focus-visible{
    outline:2px solid #000;
    outline-offset:5px;
  }

  @keyframes entranceButton{
    from{
      opacity:0;
      transform:translateY(14px) scale(.96);
      filter:blur(8px);
    }
    to{
      opacity:1;
      transform:translateY(0) scale(1);
      filter:blur(0);
    }
  }

  /* ---------- АВТОРИЗАЦИЯ ---------- */

  .auth-wrap{
    width:min(440px, 100%);
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .lock{
    position:relative;
    margin-bottom:42px;
    color:#4d4d4d;
    text-align:center;
    text-transform:uppercase;
    font-size:clamp(9px, 2.4vw, 11px);
    font-weight:550;
    letter-spacing:clamp(5px, 2vw, 8px);
    line-height:1.4;
    opacity:0;
    transform:translateY(12px);
  }

  #pass-screen.show .lock{
    animation:authRise .9s .12s both var(--ease-out);
  }

  .lock::after{
    content:"";
    display:block;
    width:34px;
    height:1px;
    margin:18px auto 0;
    background:rgba(0,0,0,.22);
    transform:scaleX(0);
    transform-origin:center;
  }

  #pass-screen.show .lock::after{
    animation:lineGrow .7s .55s both var(--ease-out);
  }

  .input-shell{
    width:100%;
    position:relative;
    opacity:0;
    transform:translateY(14px) scale(.985);
  }

  #pass-screen.show .input-shell{
    animation:authRise .92s .25s both var(--ease-out);
  }

  #pass-input{
    width:100%;
    height:66px;
    padding:0 30px;
    border:1px solid rgba(0,0,0,.22);
    border-radius:999px;
    outline:none;
    background:rgba(255,255,255,.82);
    color:#000;
    caret-color:#000;
    text-align:center;
    font-size:clamp(17px, 4.5vw, 20px);
    font-weight:480;
    letter-spacing:11px;
    box-shadow:
      0 1px 0 rgba(255,255,255,.9) inset,
      0 10px 35px rgba(0,0,0,.035);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    transition:
      border-color .3s ease,
      box-shadow .35s ease,
      transform .35s var(--ease-out),
      background .35s ease;
  }

  #pass-input::placeholder{
    color:#9d9d9d;
    opacity:1;
  }

  #pass-input:hover{
    border-color:rgba(0,0,0,.42);
  }

  #pass-input:focus{
    border-color:#000;
    background:#fff;
    box-shadow:
      0 0 0 4px rgba(0,0,0,.055),
      0 16px 45px rgba(0,0,0,.065);
    transform:translateY(-1px);
  }

  #pass-input.error{
    border-color:#b21313;
    box-shadow:0 0 0 4px rgba(178,19,19,.07);
    animation:inputShake .45s cubic-bezier(.36,.07,.19,.97);
  }

  #connect-btn,
  #locate-btn{
    border:none;
    border-radius:999px;
    cursor:pointer;
    background:#000;
    color:#fff;
    box-shadow:0 12px 28px rgba(0,0,0,.10);
    transition:
      transform .38s var(--ease-out),
      letter-spacing .5s var(--ease-out),
      background .3s ease,
      box-shadow .38s ease,
      opacity .25s ease;
  }

  #connect-btn{
    margin-top:22px;
    min-width:220px;
    padding:15px 28px 15px 34px;
    text-transform:uppercase;
    font-size:clamp(10px, 2.7vw, 12px);
    font-weight:560;
    letter-spacing:5px;
    opacity:0;
    transform:translateY(12px);
  }

  #pass-screen.show #connect-btn{
    animation:authRise .9s .38s both var(--ease-out);
  }

  #connect-btn:hover,
  #locate-btn:hover{
    transform:translateY(-2px);
    background:#111;
    box-shadow:0 16px 38px rgba(0,0,0,.14);
  }

  #connect-btn:hover{
    letter-spacing:6.5px;
  }

  #connect-btn:active,
  #locate-btn:active{
    transform:translateY(0) scale(.985);
  }

  #connect-btn:focus-visible,
  #locate-btn:focus-visible{
    outline:2px solid #000;
    outline-offset:4px;
  }

  #pass-hint{
    min-height:20px;
    margin-top:18px;
    color:#b21313;
    text-align:center;
    text-transform:uppercase;
    font-size:9px;
    font-weight:600;
    letter-spacing:2.2px;
    opacity:0;
    transform:translateY(-4px);
    transition:
      opacity .25s ease,
      transform .35s var(--ease-out);
  }

  #pass-hint.visible{
    opacity:1;
    transform:translateY(0);
  }

  @keyframes authRise{
    from{
      opacity:0;
      transform:translateY(16px) scale(.985);
      filter:blur(5px);
    }
    to{
      opacity:1;
      transform:translateY(0) scale(1);
      filter:blur(0);
    }
  }

  @keyframes lineGrow{
    from{transform:scaleX(0);opacity:0}
    to{transform:scaleX(1);opacity:1}
  }

  @keyframes inputShake{
    10%,90%{transform:translateX(-2px)}
    20%,80%{transform:translateX(4px)}
    30%,50%,70%{transform:translateX(-7px)}
    40%,60%{transform:translateX(7px)}
  }

  /* ---------- ЛИЧНЫЙ КАБИНЕТ (МЕМБЕР) ---------- */

  .member-wrap{
    width:min(900px, 100%);
    max-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .member-heading{
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  #member-screen h1{
    color:#000;
    text-align:center;
    text-transform:uppercase;
    font-size:clamp(46px, 11vw, 82px);
    font-weight:220;
    letter-spacing:clamp(8px, 3.2vw, 18px);
    line-height:.95;
    opacity:0;
    transform:translateY(20px);
  }

  #member-screen.show h1{
    animation:memberReveal 1.05s .1s both var(--ease-out);
  }

  #member-screen .status{
    margin-top:13px;
    color:#777;
    text-align:center;
    text-transform:uppercase;
    font-size:clamp(9px, 2.3vw, 11px);
    font-weight:560;
    letter-spacing:5px;
    opacity:0;
    transform:translateY(12px);
  }

  #member-screen.show .status{
    animation:memberReveal .95s .27s both var(--ease-out);
  }

  .status-dot{
    display:inline-block;
    width:5px;
    height:5px;
    margin:0 7px 2px 0;
    border-radius:50%;
    background:#000;
    box-shadow:0 0 0 0 rgba(0,0,0,.18);
    animation:statusPulse 2.2s infinite;
  }

  @keyframes statusPulse{
    0%{box-shadow:0 0 0 0 rgba(0,0,0,.18)}
    65%,100%{box-shadow:0 0 0 7px rgba(0,0,0,0)}
  }

  #locate-btn{
    margin-top:28px;
    padding:13px 24px 13px 29px;
    text-transform:uppercase;
    font-size:9px;
    font-weight:620;
    letter-spacing:3.6px;
    opacity:0;
    transform:translateY(12px);
  }

  #member-screen.show #locate-btn{
    animation:memberReveal .9s .42s both var(--ease-out);
  }

  #locate-btn:disabled{
    cursor:default;
    opacity:.55;
    transform:none;
  }

  /* ---------- ТЕРМИНАЛ ---------- */

  .terminal{
    width:min(820px, 100%);
    min-height:300px;
    margin-top:24px;
    padding:20px 22px 24px;
    position:relative;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;
    background:
      linear-gradient(180deg, #101010 0%, #090909 100%);
    color:#d9d9d9;
    box-shadow:
      0 26px 70px rgba(0,0,0,.14),
      0 1px 0 rgba(255,255,255,.06) inset;
    font-family:
      "SFMono-Regular",
      "SF Mono",
      "Roboto Mono",
      "Cascadia Code",
      Consolas,
      monospace;
    font-size:clamp(11.5px, 2.6vw, 13.5px);
    font-weight:420;
    line-height:1.75;
    opacity:0;
    transform:translateY(22px) scale(.985);
  }

  #member-screen.show .terminal{
    animation:terminalReveal 1.15s .52s both var(--ease-out);
  }

  .terminal::before{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:.18;
    background:
      linear-gradient(
        to bottom,
        transparent 0%,
        rgba(255,255,255,.055) 48%,
        rgba(255,255,255,.09) 50%,
        rgba(255,255,255,.055) 52%,
        transparent 100%
      );
    transform:translateY(-120%);
    animation:terminalSweep 7s linear infinite;
  }

  .terminal::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:.14;
    background:
      repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,.022) 0,
        rgba(255,255,255,.022) 1px,
        transparent 1px,
        transparent 4px
      );
  }

  .terminal-bar{
    position:relative;
    z-index:2;
    display:flex;
    align-items:center;
    gap:7px;
    margin-bottom:18px;
    padding-bottom:14px;
    border-bottom:1px solid rgba(255,255,255,.075);
  }

  .terminal-bar i{
    display:block;
    width:7px;
    height:7px;
    border-radius:50%;
    background:#575757;
  }

  .terminal-bar i:nth-child(2){opacity:.72}
  .terminal-bar i:nth-child(3){opacity:.48}

  .terminal-title{
    margin-left:auto;
    color:#6d6d6d;
    text-transform:uppercase;
    font-size:8px;
    font-weight:600;
    letter-spacing:2px;
  }

  .terminal-content{
    position:relative;
    z-index:2;
  }

  #terminal-output{
    white-space:pre-wrap;
    min-height:190px;
    word-break:break-word;
  }

  .cursor{
    display:inline-block;
    width:7px;
    height:15px;
    margin-left:2px;
    vertical-align:-2px;
    background:#f0f0f0;
    animation:blink .78s steps(1,end) infinite;
  }

  .privacy{
    max-width:580px;
    margin-top:20px;
    color:#8c8c8c;
    text-align:center;
    text-transform:uppercase;
    font-size:8px;
    font-weight:520;
    letter-spacing:1.4px;
    line-height:1.7;
    opacity:0;
    transform:translateY(10px);
  }

  #member-screen.show .privacy{
    animation:memberReveal .9s .72s both var(--ease-out);
  }

  @keyframes memberReveal{
    from{
      opacity:0;
      transform:translateY(18px);
      filter:blur(5px);
    }
    to{
      opacity:1;
      transform:translateY(0);
      filter:blur(0);
    }
  }

  @keyframes terminalReveal{
    from{
      opacity:0;
      transform:translateY(24px) scale(.975);
      filter:blur(8px);
    }
    to{
      opacity:1;
      transform:translateY(0) scale(1);
      filter:blur(0);
    }
  }

  @keyframes terminalSweep{
    0%{transform:translateY(-130%)}
    100%{transform:translateY(130%)}
  }

  @keyframes blink{
    0%,46%{opacity:1}
    47%,100%{opacity:0}
  }

  @media (max-width:640px){
    .screen{
      justify-content:center;
      padding-left:18px;
      padding-right:18px;
    }

    #enter-btn{
      min-width:min(305px, 88vw);
      padding-top:20px;
      padding-bottom:20px;
    }

    .lock{
      margin-bottom:32px;
    }

    #pass-input{
      height:60px;
      letter-spacing:9px;
    }

    #member-screen h1{
      letter-spacing:10px;
    }

    .terminal{
      min-height:280px;
      padding:17px 17px 21px;
      border-radius:15px;
    }

    #terminal-output{
      min-height:176px;
    }
  }

  @media (max-height:760px){
    .member-wrap{
      transform:scale(.92);
    }

    .terminal{
      min-height:250px;
      margin-top:18px;
    }

    #terminal-output{
      min-height:145px;
    }

    #locate-btn{
      margin-top:20px;
    }

    .privacy{
      margin-top:14px;
    }
  }

  @media (prefers-reduced-motion:reduce){
    *,
    *::before,
    *::after{
      animation-duration:.001ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.001ms !important;
      scroll-behavior:auto !important;
    }
  }

  .screen::before{
    content:"";
    position:absolute;
    inset:0;
    z-index:-1;
    pointer-events:none;
    opacity:.42;
    background:
      radial-gradient(circle at 50% 46%, rgba(0,0,0,.022), transparent 28%),
      radial-gradient(circle at 26% 74%, rgba(0,0,0,.012), transparent 20%);
    animation:screenAtmosphere 10s ease-in-out infinite alternate;
  }

  @keyframes screenAtmosphere{
    0%{
      transform:scale(1);
      opacity:.28;
    }
    100%{
      transform:scale(1.035);
      opacity:.52;
    }
  }

  #enter-btn{
    isolation:isolate;
  }

  #enter-btn::after{
    content:"";
    position:absolute;
    inset:-1px;
    z-index:-1;
    border-radius:inherit;
    border:1px solid rgba(0,0,0,.14);
    opacity:0;
    transform:scale(.94);
    transition:
      opacity .3s ease,
      transform .45s var(--ease-out);
  }

  #enter-btn:hover::after{
    opacity:1;
    transform:scale(1.075);
  }

  #enter-screen:not(.leaving) #enter-btn{
    animation:
      entranceButton 1s .15s both var(--ease-out),
      entryIdle 4.8s 1.3s ease-in-out infinite;
  }

  @keyframes entryIdle{
    0%,100%{
      box-shadow:
        0 1px 0 rgba(255,255,255,.15) inset,
        0 18px 50px rgba(0,0,0,.12);
    }
    50%{
      box-shadow:
        0 1px 0 rgba(255,255,255,.17) inset,
        0 22px 58px rgba(0,0,0,.15);
    }
  }

  #enter-screen.leaving::after{
    content:"";
    position:absolute;
    left:50%;
    top:50%;
    width:5px;
    height:5px;
    border-radius:50%;
    background:#000;
    opacity:0;
    transform:translate(-50%,-50%) scale(.5);
    animation:entryCore .78s .28s both var(--ease-out);
  }

  @keyframes entryCore{
    0%{
      opacity:0;
      transform:translate(-50%,-50%) scale(.4);
    }
    30%{
      opacity:.9;
      transform:translate(-50%,-50%) scale(1);
    }
    100%{
      opacity:0;
      transform:translate(-50%,-50%) scale(6);
    }
  }

  #pass-screen.show .auth-wrap{
    animation:authWrapReveal 1.05s both var(--ease-out);
  }

  @keyframes authWrapReveal{
    from{
      opacity:0;
      transform:translateY(18px) scale(.975);
    }
    to{
      opacity:1;
      transform:translateY(0) scale(1);
    }
  }

  .lock{
    text-shadow:0 0 0 rgba(0,0,0,0);
  }

  #pass-screen.show .lock{
    animation:
      authRise .9s .12s both var(--ease-out),
      lockBreath 4s 1.2s ease-in-out infinite;
  }

  @keyframes lockBreath{
    0%,100%{
      opacity:1;
      letter-spacing:clamp(5px, 2vw, 8px);
    }
    50%{
      opacity:.78;
      letter-spacing:clamp(5.4px, 2.15vw, 8.5px);
    }
  }

  .input-shell::before{
    content:"";
    position:absolute;
    left:12%;
    right:12%;
    top:0;
    height:1px;
    z-index:3;
    pointer-events:none;
    background:
      linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.85),
        transparent
      );
    opacity:0;
    transform:scaleX(.5);
    transition:
      opacity .25s ease,
      transform .45s var(--ease-out);
  }

  .input-shell:focus-within::before{
    opacity:1;
    transform:scaleX(1);
  }

  #pass-input:focus{
    transform:translateY(-2px) scale(1.004);
  }

  .input-shell:has(#pass-input.error)::after{
    content:"";
    position:absolute;
    inset:-6px;
    border:1px solid rgba(178,19,19,.10);
    border-radius:999px;
    pointer-events:none;
    animation:errorRing .55s ease-out both;
  }

  @keyframes errorRing{
    0%{
      opacity:.8;
      transform:scale(.98);
    }
    100%{
      opacity:0;
      transform:scale(1.045);
    }
  }

  #connect-btn,
  #locate-btn{
    position:relative;
    overflow:hidden;
  }

  #connect-btn::before,
  #locate-btn::before{
    content:"";
    position:absolute;
    top:-55%;
    left:-40%;
    width:24%;
    height:220%;
    transform:rotate(18deg);
    background:
      linear-gradient(
        to right,
        transparent,
        rgba(255,255,255,.18),
        transparent
      );
    transition:left .72s var(--ease-out);
  }

  #connect-btn:hover::before,
  #locate-btn:hover::before{
    left:118%;
  }

  #pass-hint.visible{
    animation:hintPop .38s both var(--ease-out);
  }

  @keyframes hintPop{
    from{
      opacity:0;
      transform:translateY(-5px) scale(.98);
    }
    to{
      opacity:1;
      transform:translateY(0) scale(1);
    }
  }

  #pass-screen.leaving::after{
    content:"";
    position:absolute;
    left:50%;
    top:50%;
    width:10px;
    height:10px;
    border-radius:50%;
    border:1px solid rgba(0,0,0,.12);
    transform:translate(-50%,-50%) scale(.4);
    animation:successWave .8s both var(--ease-out);
    pointer-events:none;
  }

  @keyframes successWave{
    0%{
      opacity:0;
      transform:translate(-50%,-50%) scale(.4);
    }
    25%{
      opacity:.4;
    }
    100%{
      opacity:0;
      transform:translate(-50%,-50%) scale(34);
    }
  }

  #member-screen.show h1{
    animation:
      memberReveal 1.05s .1s both var(--ease-out),
      eliteTracking 1.35s .08s both var(--ease-out);
  }

  @keyframes eliteTracking{
    from{
      letter-spacing:clamp(14px, 5vw, 28px);
    }
    to{
      letter-spacing:clamp(8px, 3.2vw, 18px);
    }
  }

  #member-screen.show .status-dot{
    animation:
      statusPulse 2.2s infinite,
      statusAppear .6s .35s both var(--ease-out);
  }

  @keyframes statusAppear{
    from{
      opacity:0;
      transform:scale(.3);
    }
    to{
      opacity:1;
      transform:scale(1);
    }
  }

  #locate-btn::after{
    content:"";
    position:absolute;
    right:17px;
    top:50%;
    width:4px;
    height:4px;
    margin-top:-2px;
    border-radius:50%;
    background:rgba(255,255,255,.72);
    opacity:.55;
    animation:locateDot 1.8s ease-in-out infinite;
  }

  @keyframes locateDot{
    0%,100%{
      opacity:.25;
      transform:scale(.8);
    }
    50%{
      opacity:.9;
      transform:scale(1.2);
    }
  }

  .terminal{
    transition:
      transform .35s var(--ease-out),
      box-shadow .35s ease,
      border-color .35s ease;
  }

  .terminal:hover{
    border-color:rgba(255,255,255,.12);
    box-shadow:
      0 30px 78px rgba(0,0,0,.17),
      0 1px 0 rgba(255,255,255,.07) inset;
  }

  .terminal-bar i{
    animation:terminalDot 2.4s ease-in-out infinite;
  }

  .terminal-bar i:nth-child(2){
    animation-delay:.22s;
  }

  .terminal-bar i:nth-child(3){
    animation-delay:.44s;
  }

  @keyframes terminalDot{
    0%,100%{
      transform:scale(.85);
      opacity:.35;
    }
    50%{
      transform:scale(1);
      opacity:.85;
    }
  }

  .terminal-title{
    animation:terminalTitleBreath 4.5s ease-in-out infinite;
  }

  @keyframes terminalTitleBreath{
    0%,100%{opacity:.62}
    50%{opacity:.92}
  }

  .terminal-content::before{
    content:"";
    position:absolute;
    left:0;
    top:-8px;
    width:0;
    height:1px;
    background:
      linear-gradient(
        90deg,
        rgba(255,255,255,.14),
        rgba(255,255,255,.62),
        rgba(255,255,255,.14)
      );
    opacity:.5;
    animation:terminalProgress 6s ease-in-out infinite;
  }

  @keyframes terminalProgress{
    0%{
      width:0;
      opacity:0;
    }
    15%{
      opacity:.5;
    }
    70%{
      width:100%;
      opacity:.35;
    }
    100%{
      width:100%;
      opacity:0;
    }
  }

  .cursor{
    animation:
      blink .78s steps(1,end) infinite,
      cursorGlow 2.2s ease-in-out infinite;
  }

  @keyframes cursorGlow{
    0%,100%{
      box-shadow:0 0 0 rgba(255,255,255,0);
    }
    50%{
      box-shadow:0 0 10px rgba(255,255,255,.22);
    }
  }

  @media (max-width:640px){
    body::after{
      opacity:.11;
      background-size:54px 54px;
    }

    #enter-btn:hover{
      transform:none;
      letter-spacing:clamp(7px, 2.4vw, 12px);
    }

    .terminal:hover{
      transform:none;
    }
  }

  @media (prefers-reduced-motion:reduce){
    .ambient,
    .ambient *,
    body::before,
    body::after{
      animation:none !important;
    }
  }
</style>
</head>
<body>

  <!-- ЭКРАН 1: ВХОД -->
  <div id="enter-screen" class="screen">
    <button id="enter-btn" type="button">ВОЙТИ</button>
  </div>

  <!-- ЭКРАН 2: АВТОРИЗАЦИЯ / ПАРОЛЬ -->
  <div id="pass-screen" class="screen">
    <div class="auth-wrap">
      <div class="lock">ЗАЩИЩЕННЫЙ ДОСТУП ELITE</div>
      <div class="input-shell">
        <input id="pass-input" type="password" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <button id="connect-btn" type="button">ПОДТВЕРДИТЬ</button>
      <div id="pass-hint">КЛЮЧ ДОСТУПА НЕВЕРНЫЙ</div>
    </div>
  </div>

  <!-- ЭКРАН 3: ЛИЧНЫЙ КАБИНЕТ / УПРАВЛЕНИЕ -->
  <div id="member-screen" class="screen">
    <div class="member-wrap">
      <div class="member-heading">
        <h1>ЭЛИТА</h1>
        <div class="status">
          <span class="status-dot"></span>СИСТЕМА ЗАЩИЩЕНА И АКТИВНА
        </div>
      </div>
      <button id="locate-btn" type="button">ЗАПУСТИТЬ ДИГНОСТИКУ</button>
      
      <div class="terminal">
        <div class="terminal-bar">
          <i></i><i></i><i></i>
          <span class="terminal-title">Secure Terminal v4.2</span>
        </div>
        <div class="terminal-content">
          <div id="terminal-output"></div><span class="cursor"></span>
        </div>
      </div>

      <div class="privacy">
        КОНФИДЕНЦИАЛЬНО • ЗАКРЫТЫЙ СЕГМЕНТ СВЯЗИ • ВСЕ ДАННЫЕ ЗАШИФРОВАНЫ
      </div>
    </div>
  </div>

  <script>
    const enterScreen = document.getElementById('enter-screen');
    const enterBtn = document.getElementById('enter-btn');
    const passScreen = document.getElementById('pass-screen');
    const passInput = document.getElementById('pass-input');
    const connectBtn = document.getElementById('connect-btn');
    const passHint = document.getElementById('pass-hint');
    const memberScreen = document.getElementById('member-screen');
    const locateBtn = document.getElementById('locate-btn');
    const terminalOutput = document.getElementById('terminal-output');

    // Ключ доступа для проверки (можно изменить при необходимости)
    const CORRECT_PASS = "ELITE2026";

    enterBtn.addEventListener('click', () => {
      enterScreen.classList.add('leaving');
      setTimeout(() => {
        enterScreen.classList.add('collapse-line');
      }, 460);
      setTimeout(() => {
        enterScreen.classList.add('fade-away');
        passScreen.classList.add('show');
        passInput.focus();
      }, 750);
    });

    function handleAuth() {
      const val = passInput.value.trim();
      if (val === CORRECT_PASS) {
        passHint.classList.remove('visible');
        passInput.classList.remove('error');
        passScreen.classList.add('leaving');
        setTimeout(() => {
          passScreen.style.display = 'none';
          memberScreen.classList.add('show');
          startTerminalSequence();
        }, 700);
      } else {
        passInput.classList.add('error');
        passHint.classList.add('visible');
        setTimeout(() => {
          passInput.classList.remove('error');
        }, 500);
      }
    }

    connectBtn.addEventListener('click', handleAuth);
    passInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        handleAuth();
      }
    });

    const terminalLogs = [
      "Инициализация безопасного ядра...",
      "Проверка криптографических ключей шифрования...",
      "Соединение с защищенным узлом [RU-CENTRAL-01] установлено успешно.",
      "Статус доступа: Уровень 1 (Элита).",
      "Ожидание пользовательских команд..."
    ];

    function startTerminalSequence() {
      let lineIndex = 0;
      let charIndex = 0;
      let currentText = "";

      function typeLine() {
        if (lineIndex < terminalLogs.length) {
          if (charIndex < terminalLogs[lineIndex].length) {
            currentText += terminalLogs[lineIndex].charAt(charIndex);
            terminalOutput.textContent = currentText;
            charIndex++;
            setTimeout(typeLine, 25);
          } else {
            currentText += "\n";
            lineIndex++;
            charIndex = 0;
            setTimeout(typeLine, 400);
          }
        }
      }
      setTimeout(typeLine, 600);
    }

    let isScanning = false;
    locateBtn.addEventListener('click', () => {
      if (isScanning) return;
      isScanning = true;
      locateBtn.textContent = "В ПРОЦЕССЕ СКАНИРОВАНИЯ...";
      locateBtn.disabled = true;

      const scanLogs = [
        "\n> Запуск полного сканирования сети...",
        "> Проверка целостности каналов связи...",
        "> Угроз не обнаружено. Система работает в штатном режиме."
      ];

      let idx = 0;
      function appendScan() {
        if (idx < scanLogs.length) {
          terminalOutput.textContent += "\n" + scanLogs[idx];
          idx++;
          setTimeout(appendScan, 500);
        } else {
          isScanning = false;
          locateBtn.textContent = "ЗАПУСТИТЬ ДИГНОСТИКУ";
          locateBtn.disabled = false;
        }
      }
      setTimeout(appendScan, 400);
    });
  </script>
</body>
</html>
